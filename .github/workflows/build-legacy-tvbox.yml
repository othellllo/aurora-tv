name: Build legacy TVBox (Android 5.x)

on:
  workflow_dispatch:

jobs:
  tvbox-legacy:
    name: TVBox legacy APK (armeabi-v7a)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TVBOX_COMMIT: 89ec1b7504426b3ff5e9d0996c3bbf50c9d2eff0
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-33" "build-tools;33.0.2" "platform-tools"

      - name: Download TVBoxOS source
        run: |
          curl -L --retry 3 -o tvbox.zip "https://codeload.github.com/q215613905/TVBoxOS/zip/${TVBOX_COMMIT}"
          unzip -q tvbox.zip
          mv TVBoxOS-* legacy

      - name: Patch name and default source
        run: node scripts/patch-tvbox-legacy.mjs legacy

      - name: Configure SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > legacy/local.properties

      - name: Build java32 debug APK
        working-directory: legacy
        run: |
          chmod +x gradlew
          ./gradlew assembleJava32Debug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aurora-tv-legacy-tvbox
          if-no-files-found: error
          path: legacy/app/build/outputs/apk/**/debug/*.apk
